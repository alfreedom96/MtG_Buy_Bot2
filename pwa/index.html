<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2622">
<title>Price Watch</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --felt: #0E2622;
  --felt-2: #143630;
  --felt-3: #1D4740;
  --line: #2A5A52;
  --ink: #EAF2EE;
  --muted: #93ADA6;
  --silver: #B7C4C9;
  --gold: #E3B94F;
  --mythic: #F2713A;
  --danger: #EF6B77;
  --r-sm: 6px;
  --r-md: 12px;
  --r-lg: 20px;
  --pad: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--felt); color: var(--ink); }
body {
  font-family: "Barlow Semi Condensed", system-ui, sans-serif;
  font-size: 17px; line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--gold); }
[hidden] { display: none !important; }

/* ---------- barra superiore ---------- */
.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--felt);
  padding: calc(env(safe-area-inset-top) + 12px) var(--pad) 10px;
  border-bottom: 1px solid var(--felt-3);
}
.top-row { display: flex; align-items: center; gap: 8px; }
.top h1 { font-size: 26px; font-weight: 700; margin: 0; flex: 1; letter-spacing: .2px; }
.top .fresh { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--felt-2);
  display: grid; place-items: center; padding: 0;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.spin svg { animation: none; } }

.search { position: relative; }
.search input {
  width: 100%; height: 46px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--felt-2);
  padding: 0 14px 0 40px; font-size: 17px;
}
.search input::placeholder { color: var(--muted); }
.search > svg { position: absolute; left: 12px; top: 13px; width: 20px; height: 20px; color: var(--muted); }
.suggest {
  position: absolute; left: 0; right: 0; top: 52px;
  background: var(--felt-2); border: 1px solid var(--line); border-radius: var(--r-md);
  max-height: 60vh; overflow: auto; z-index: 10;
  box-shadow: 0 12px 30px rgba(0,0,0,.45);
}
.suggest button {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  padding: 12px 14px; border-bottom: 1px solid var(--felt-3);
}
.suggest button:last-child { border-bottom: 0; }
.suggest .hint { padding: 12px 14px; color: var(--muted); }

.filters { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
.filters button {
  white-space: nowrap; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; padding: 5px 12px; font-size: 15px; color: var(--muted);
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--felt); border-color: var(--ink); font-weight: 600; }

/* ---------- lista carte ---------- */
main { padding: 8px var(--pad) 40px; max-width: 720px; margin: 0 auto; }
.card-row {
  display: grid; grid-template-columns: 64px 1fr; gap: 12px;
  width: 100%; text-align: left; background: none; border: 0;
  padding: 12px 0; border-bottom: 1px solid var(--felt-3);
}
.thumb {
  width: 64px; height: 47px; border-radius: var(--r-sm); object-fit: cover;
  background: var(--felt-3); display: block;
}
.card-row h2 { font-size: 19px; font-weight: 600; margin: 0 0 4px; }
.variant { display: flex; align-items: center; gap: 8px; min-height: 26px; }
.variant .lbl { color: var(--muted); font-size: 15px; flex: 1; }
.variant .price { font-weight: 700; font-size: 19px; }
.variant .spark { width: 56px; height: 20px; }
.gem { width: 10px; height: 10px; border-radius: 2px; transform: rotate(45deg); flex: none; background: var(--silver); }
.gem.gold { background: var(--gold); }
.gem.mythic { background: var(--mythic); box-shadow: 0 0 0 3px rgba(242,113,58,.25); }
.gem.wait { background: transparent; border: 1.5px solid var(--muted); }
.gem.err { background: var(--danger); }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; }
.empty strong { display: block; color: var(--ink); font-size: 20px; margin-bottom: 6px; }

.banner { background: var(--felt-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; margin: 12px 0 4px; }
.banner p { margin: 0 0 10px; }

/* ---------- dettaglio ---------- */
.detail-head { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0 6px; }
.detail-head img { width: 110px; border-radius: 6px; flex: none; background: var(--felt-3); aspect-ratio: 488/680; }
.detail-head h2 { font-size: 26px; margin: 4px 0 6px; line-height: 1.1; }
.back { background: none; border: 0; color: var(--muted); padding: 0; display: inline-flex; align-items: center; gap: 4px; font-size: 16px; }
.vsec { border-top: 1px solid var(--felt-3); padding: 16px 0 6px; }
.vsec h3 { font-size: 17px; font-weight: 600; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.vsec h3 .sp { flex: 1; }
.big { font-size: 44px; font-weight: 700; line-height: 1; }
.status { margin: 8px 0 0; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.status.mythic { color: var(--mythic); }
.status.gold { color: var(--gold); }
.status.err { color: var(--danger); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.stats div { background: var(--felt-2); border-radius: var(--r-sm); padding: 8px 10px; }
.stats small { display: block; color: var(--muted); font-size: 14px; }
.stats b { font-size: 18px; }
.chart { position: relative; margin: 6px 0 4px; touch-action: pan-y; }
.chart svg { width: 100%; height: 190px; display: block; }
.chart .tip {
  position: absolute; top: 0; transform: translateX(-50%);
  background: var(--ink); color: var(--felt); border-radius: var(--r-sm);
  padding: 2px 8px; font-size: 14px; font-weight: 600; white-space: nowrap; pointer-events: none;
}
.ranges { display: flex; gap: 6px; justify-content: flex-end; }
.ranges button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 14px; color: var(--muted); }
.ranges button[aria-pressed="true"] { color: var(--felt); background: var(--silver); border-color: var(--silver); }
.offer { background: var(--felt-2); border-radius: var(--r-md); padding: 12px 14px; margin: 12px 0; }
.offer p { margin: 2px 0; }
.offer .muted { color: var(--muted); font-size: 15px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 18px; border-radius: var(--r-md); border: 1px solid var(--line);
  background: var(--felt-2); font-weight: 600; text-decoration: none; color: var(--ink);
}
.btn.primary { background: var(--gold); border-color: var(--gold); color: #2A2105; }
.btn.danger { color: var(--danger); border-color: rgba(239,107,119,.5); background: transparent; }
.btn.block { width: 100%; }
.offer .btn { margin-top: 10px; }
.settings-line { color: var(--muted); font-size: 15px; margin: 6px 0 12px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- pannello (sheet) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(4,12,10,.6); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  background: var(--felt-2); border-radius: var(--r-lg) var(--r-lg) 0 0;
  max-height: 92dvh; overflow: auto;
  padding: 18px var(--pad) calc(env(safe-area-inset-bottom) + 18px);
  max-width: 720px; margin: 0 auto;
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h2 { margin: 0 0 4px; font-size: 24px; }
.sheet .sub { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
.field { margin: 16px 0; }
.field > label, .field > .lab { display: block; font-weight: 600; margin-bottom: 6px; }
.field .help { color: var(--muted); font-size: 14px; margin-top: 4px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.seg button { flex: 1; background: none; border: 0; padding: 10px 4px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--felt); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.input {
  width: 100%; height: 44px; border-radius: var(--r-md); border: 1px solid var(--line);
  background: var(--felt); padding: 0 12px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 220px; overflow: auto; padding: 2px; }
.chip {
  border: 1px solid var(--line); background: var(--felt); border-radius: 999px;
  padding: 5px 11px; font-size: 14px; color: var(--ink);
}
.chip[data-state="in"] { background: var(--silver); color: var(--felt); border-color: var(--silver); font-weight: 600; }
.chip[data-state="out"] { color: var(--muted); text-decoration: line-through; border-style: dashed; }
details summary { color: var(--muted); cursor: pointer; margin: 8px 0; }
.sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
.sheet-actions .btn { flex: 1; }
.menu-list .btn { width: 100%; justify-content: flex-start; margin-bottom: 8px; }

/* ---------- accesso ---------- */
.login { max-width: 380px; margin: 0 auto; padding: 20vh var(--pad) 0; }
.login h1 { font-size: 34px; margin: 0 0 6px; }
.login p { color: var(--muted); margin: 0 0 20px; }
.login .err { color: var(--danger); margin-top: 10px; }

/* ---------- avvisi ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 20px); z-index: 40;
  background: var(--ink); color: var(--felt); padding: 10px 16px; border-radius: var(--r-md);
  font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
