name: Diagnostica errore 403
on:
  workflow_dispatch: {}
concurrency:
  group: diagnostica
jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alfreedom96/MtG_Buy_Bot_data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - run: pip install requests
      - env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python diagnostica_403.py
      - if: always()
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag_403.json || exit 0
          git diff --quiet --cached || git commit -m "Diagnostica 403 [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 5; done
