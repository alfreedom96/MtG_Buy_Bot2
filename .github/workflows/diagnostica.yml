name: Diagnostica sito contro API
on:
  workflow_dispatch: {}
concurrency:
  group: check-prices
  cancel-in-progress: false
jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: alfreedom96/MtG_Buy_Bot_data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python diagnostica_sito.py
      - if: always()
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag_sito* || exit 0
          git diff --quiet --cached || git commit -m "Diagnostica sito [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 5; done
