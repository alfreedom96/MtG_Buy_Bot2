name: Comandi Telegram CardTrader

on:
  workflow_dispatch:
    inputs:
      comando:
        description: 'Testo del comando Telegram (lasciare vuoto per controllare i messaggi in sospeso via polling)'
        required: false
        default: ''
  schedule:
    # Fallback: controlla se ci sono messaggi rimasti in sospeso, nel caso
    # il webhook (Cloudflare Worker) non funzionasse per qualche motivo.
    # Con il webhook attivo, questa esecuzione trova normalmente "nessun
    # messaggio" e non fa nulla.
    - cron: "0 * * * *"

jobs:
  check-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (codice pubblico)
        uses: actions/checkout@v4

      - name: Checkout repository dati (privato)
        uses: actions/checkout@v4
        with:
          repository: TUO_UTENTE/NOME_REPO_DATI_PRIVATO
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla comandi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMANDO_DIRETTO: ${{ github.event.inputs.comando }}
        run: python bot_commands.py

      - name: Salva l'offset dei messaggi letti nel repository dati privato
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_offset.json
          git diff --quiet --cached || git commit -m "Aggiorna offset comandi Telegram [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push fallito (probabile scontro con un altro workflow), ritento tra 5s... ($i/5)"
            sleep 5
          done
